  <div style="margin: 0 16px; display: flex; gap: 10px">
    <div style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line)">
      <span style="width: 28px; height: 28px; border-radius: 999px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font: 600 12px 'Space Grotesk', sans-serif">R</span>
      <span style="font-size: 14px"><span style="font-weight: 600">You</span> <span class="sub">{{you}}/{{target}}</span></span>
    </div>
    <div style="flex: 1; display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line)">
      <span style="width: 28px; height: 28px; border-radius: 999px; background: var(--partner); color: var(--on-partner); display: flex; align-items: center; justify-content: center; font: 600 12px 'Space Grotesk', sans-serif">N</span>
      <span style="font-size: 14px; flex: 1"><span style="font-weight: 600">Naziha</span> <span class="sub">{{her}}/{{target}}</span></span>
      <span class="live" aria-label="Live"></span>
    </div>
  </div>

  <div style="margin: 12px 16px 40px; display: flex; gap: 8px" aria-label="Sequence">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div class="{{s.cls}}"><div style="font-size: 13px; font-weight: 600">{{s.name}}</div><div class="sub" style="font-size: 12px; margin-top: 2px">× {{s.n}}</div></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props);
    // theme: read the saved choice once per document and follow changes made on other screens
    if (!window.__lvTheme) { window.__lvTheme = 1;
      const apply = (t, x, y) => { const h = document.documentElement, go = () => h.setAttribute('data-theme', t || 'midnight');
        if (h.hasAttribute('data-theme') && h.getAttribute('data-theme') !== t && document.startViewTransition) {
          h.style.setProperty('--vx', (x == null ? innerWidth / 2 : x) + 'px'); h.style.setProperty('--vy', (y == null ? innerHeight * 0.4 : y) + 'px');
          h.classList.add('theme-vt'); const vt = document.startViewTransition(go); vt.finished.finally(() => h.classList.remove('theme-vt'));
        } else go(); };
      window.__lvApply = apply;
      let t = 'midnight'; try { t = localStorage.getItem('lovinity-theme') || 'midnight'; } catch (e) {}
      apply(t);
      window.addEventListener('storage', (e) => { if (e.key === 'lovinity-theme') apply(e.newValue); });
    }
 this.state = { step: 0, you: 12, her: 21 }; }
  componentDidMount() {
    // Naziha's count arrives live from her phone
    this.timer = setInterval(() => this.setState((s) => ({ her: Math.min(this.target(s.step), s.her + 1) })), 1600);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  target(step) { return step === 2 ? 34 : 33; }
  count() {
    try { if (navigator.vibrate) navigator.vibrate(this.state.you + 2 >= this.target(this.state.step) ? [12, 40, 12] : 8); } catch (e) {}

      const t = this.target(s.step);

  }
  renderVals() {
    const defs = [['SubhanAllah', 'سُبْحَانَ ٱللَّٰهِ'], ['Alhamdulillah', 'ٱلْحَمْدُ لِلَّٰهِ'], ['Allahu Akbar', 'ٱللَّٰهُ أَكْبَرُ']];
    const { step, you, her } = this.state;
    const target = this.target(step);
    return {
      name: defs[step][0], ar: defs[step][1], round: step + 1, target, you, her,
      aria: defs[step][0] + ', ' + you + ' of ' + target + '. Tap to count.',
      youOff: (779 * (1 - you / target)).toFixed(1),
      herOff: (679 * (1 - her / target)).toFixed(1),
      steps: defs.map((d, i) => ({ name: d[0], n: i === 2 ? 34 : 33, cls: 'step' + (i === step ? ' on' : i < step ? ' done' : '') })),
