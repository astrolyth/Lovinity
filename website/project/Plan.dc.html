.primary:disabled{background:var(--surface-2)!important;color:var(--faint)!important;box-shadow:inset 0 0 0 1px var(--line)!important}
.primary:disabled::after{display:none}
.ghost{background:rgb(var(--hi) / .04)!important;border-color:rgb(var(--hi) / .1)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgb(var(--hi) / .07)}
.field{background:rgb(var(--hi) / .035)!important;transition:border-color .3s var(--ease),box-shadow .4s var(--spring)}
.field:focus{border-color:rgb(var(--accent-rgb) / .7)!important;box-shadow:0 0 0 4px rgb(var(--accent-rgb) / .13),0 8px 24px -12px rgb(var(--accent-rgb) / .4)}
.chip{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgb(var(--hi) / .05)}
.seg[aria-pressed="true"]{box-shadow:inset 0 1px 0 rgb(var(--hi) / .08),0 4px 14px -4px rgb(var(--shadow) / .6)}
/* iOS switch: the thumb stretches while held */
.switch span{box-shadow:0 2px 6px rgb(var(--shadow) / .4),inset 0 -1px 0 rgb(var(--shadow) / .08);transition:transform .5s var(--bounce),width .35s var(--spring)!important}
.switch:active span{width:32px}
.switch[aria-checked="true"]:active span{transform:translateX(14px)}
.switch[aria-checked="true"]{box-shadow:0 0 20px -4px rgb(var(--accent-rgb) / .55),inset 0 1px 0 rgb(var(--hi) / .3)}
/* floating glass tab bar */
.nav{left:14px!important;right:14px!important;bottom:20px!important;height:64px!important;padding:0 6px!important;align-items:center!important;border-radius:999px!important;border:1px solid rgb(var(--hi) / .09)!important;box-shadow:inset 0 1px 0 rgb(var(--hi) / .09),0 20px 44px -14px rgb(var(--shadow) / .85)!important;z-index:20}
.nav a{flex:1;min-width:0!important;padding:7px 0 6px!important;border-radius:999px;font-size:10.5px!important}
.nav a.on{background:linear-gradient(180deg,rgb(var(--accent-rgb) / .18),rgb(var(--accent-rgb) / .05));box-shadow:inset 0 0 0 1px rgb(var(--accent-rgb) / .2),inset 0 1px 0 rgb(var(--hi) / .08)}
.nav a.on svg{animation:navPop .7s var(--bounce) both}
.nav .badge{top:3px!important;right:calc(50% - 24px)!important;box-shadow:0 0 0 2px var(--card-b)}
@keyframes navPop{from{scale:.6;opacity:.4}}
.toast{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgb(var(--surface-rgb) / .78)!important;box-shadow:0 18px 40px -14px rgb(var(--shadow) / .85),inset 0 1px 0 rgb(var(--hi) / .07);animation:toastIn .6s var(--bounce) both!important}
@keyframes toastIn{from{opacity:0;transform:translateY(24px) scale(.94);filter:blur(6px)}}
/* type */
.scr h1.disp:not(.plain){background:linear-gradient(180deg,var(--text) 15%,var(--text-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.shine{background:linear-gradient(110deg,var(--accent) 30%,var(--accent-hi) 46%,var(--partner) 62%,var(--accent) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:shine 7s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
/* border beam */
.beam{position:relative}
.beam::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:2;background:conic-gradient(from var(--beam),transparent 0 70%,rgb(var(--accent-rgb) / .9) 84%,var(--partner) 92%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:beam 7s linear infinite}
@keyframes beam{to{--beam:360deg}}
/* entrances blur in; scroll-driven reveal and header edge */
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(8px)}}
@supports (animation-timeline:view()){
.scroll .card:not(.rise){animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
.scroll>header::after{animation:edge linear both;animation-timeline:scroll();animation-range:0 48px}
}
@keyframes reveal{from{opacity:0;transform:translateY(28px) scale(.97);filter:blur(6px)}}
@keyframes edge{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:opacity .2s ease,background-color .2s ease,color .2s ease!important}.scr :is(a,button):active{scale:none!important}}
@media (prefers-reduced-transparency:reduce){.nav,.scroll>header,.toast,.sheet,.tag{background:var(--surface)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}}
@media (prefers-contrast:more){.card,.tile,.iconbtn{border-color:var(--faint)!important}.sub,.eyebrow{color:var(--text-2)!important}}
</style>
</helmet>
<div class="scr">
<div class="scroll">
  <header style="padding: 58px 16px 0; display: flex; align-items: center; gap: 12px">
    <a class="iconbtn" href="Main.dc.html" aria-label="Back to home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 class="disp" style="flex: 1; margin: 0; font-size: 20px; font-weight: 500; text-align: center">This week</h1>
    <button type="button" onClick="{{openEvent}}" class="iconbtn" aria-label="Add event"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
  </header>

  <div style="display: flex; gap: 2px; margin: 18px 12px 0" role="group" aria-label="Pick a day">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <button class="day" type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}" aria-label="{{d.aria}}">{{d.dow}}<b>{{d.num}}</b><span class="dots"><sc-for list="{{d.dots}}" as="c" hint-placeholder-count="1"><i style="background: {{c.color}}"></i></sc-for></span></button>
    </sc-for>
  </div>

  <section class="card" style="margin: 14px 16px 0; padding: 4px 18px" aria-label="Agenda">
    <sc-for list="{{events}}" as="e" hint-placeholder-count="2">
      <div class="ev rise">
        <span class="bar" style="background: {{e.color}}"></span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600">{{e.title}}</span><span class="sub" style="display: block; font-size: 12px; margin-top: 2px">{{e.when}}</span></span>
      </div>
    </sc-for>
  </section>

  <div style="display: flex; align-items: center; justify-content: space-between; margin: 24px 20px 10px"><div class="eyebrow">Dinner · {{dayName}}</div><button type="button" onClick="{{openMeal}}" style="background: none; color: var(--accent); border: 0; font: inherit; cursor: pointer; font-weight: 600; font-size: 13px; font-size: 13px; font-weight: 600; min-height: 44px; display: flex; align-items: center">Recipes</button></div>
  <section class="card rise" style="margin: 0 16px; padding: 16px; display: flex; align-items: center; gap: 14px; border-radius: 20px">
    <span style="width: 52px; height: 52px; border-radius: 16px; background: var(--surface-2); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none"><svg class="ico" viewBox="0 0 24 24" style="width: 24px; height: 24px" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20"></path><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg></span>
    <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 600">{{meal}}</span><span class="sub" style="display: block; font-size: 12px; margin-top: 2px">{{cook}}</span></span>
  </section>

  <div style="display: flex; align-items: center; justify-content: space-between; margin: 24px 20px 10px"><div class="eyebrow">Groceries</div><span class="sub" style="font-size: 12px">{{left}} left</span></div>
  <section class="card" style="margin: 0 16px; overflow: hidden; border-radius: 20px" aria-label="Shared grocery list">
    <sc-for list="{{items}}" as="g" hint-placeholder-count="6">
      <button class="item" type="button" role="checkbox" aria-checked="{{g.done}}" onClick="{{g.toggle}}">
        <span class="{{g.box}}"><svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke-width: 3" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
        <span class="{{g.text}}" style="flex: 1">{{g.name}}</span>
        <span class="av" style="background: {{g.bg}}; color: {{g.fg}}" aria-label="{{g.whoLabel}}">{{g.who}}</span>
      </button>
    </sc-for>
  </section>
</div>

<sc-if value="{{kHasToast}}" hint-placeholder-val="{{ false }}"><div class="ktoast" role="status"><svg class="ico" viewBox="0 0 24 24" style="width: 18px; height: 18px; stroke-width: 2.4" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span>{{kToast}}</span><sc-if value="{{kCanUndo}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{kUndo}}">Undo</button></sc-if></div></sc-if>
<sc-if value="{{kOpen}}" hint-placeholder-val="{{ false }}">
  <div class="kscrim" onClick="{{kClose}}" style="opacity: {{kScrimOp}}"></div>
  <div class="{{kSheetCls}}" role="dialog" aria-modal="true" aria-label="{{kTitle}}" style="transform: translateY({{kSdy}}px)">
    <div class="kgrab" onPointerDown="{{kDown}}" onPointerMove="{{kMove}}" onPointerUp="{{kUp}}" onPointerCancel="{{kUp}}" title="Drag down to close"><span></span></div>
    <h2 class="disp plain">{{kTitle}}</h2>
    <sc-if value="{{isEvent}}" hint-placeholder-val="{{ false }}">
      <input class="kfld" placeholder="What are you planning?" aria-label="Event title" value="{{evTitle}}" onChange="{{onEv}}">
      <span class="klbl">Day</span><div class="kchips"><sc-for list="{{evDays}}" as="o" hint-placeholder-count="7"><button class="kchip" type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="padding: 0 12px">{{o.t}}</button></sc-for></div>
      <span class="klbl">When</span><div class="kchips"><sc-for list="{{evTimes}}" as="o" hint-placeholder-count="4"><button class="kchip" type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.t}}</button></sc-for></div>
      <span class="klbl">Who</span><div class="kchips"><sc-for list="{{evWho}}" as="o" hint-placeholder-count="3"><button class="kchip" type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}">{{o.t}}</button></sc-for></div>
      <button class="kbtn gold" type="button" style="margin-top: 20px" disabled="{{noEv}}" onClick="{{saveEv}}">Add to the week</button>
    </sc-if>
    <sc-if value="{{isMeal}}" hint-placeholder-val="{{ false }}">
      <sc-for list="{{mealOpts}}" as="o" hint-placeholder-count="5"><button class="krow" type="button" onClick="{{o.pick}}"><span class="kic">{{o.e}}</span><span>{{o.t}}<small>{{o.c}}</small></span></button></sc-for>
    </sc-if>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props);
    // theme: read the saved choice once per document and follow changes made on other screens
    if (!window.__lvTheme) { window.__lvTheme = 1;
      const apply = (t, x, y) => { const h = document.documentElement, go = () => h.setAttribute('data-theme', t || 'midnight');
        if (h.hasAttribute('data-theme') && h.getAttribute('data-theme') !== t && document.startViewTransition) {
          h.style.setProperty('--vx', (x == null ? innerWidth / 2 : x) + 'px'); h.style.setProperty('--vy', (y == null ? innerHeight * 0.4 : y) + 'px');
          h.classList.add('theme-vt'); const vt = document.startViewTransition(go); vt.finished.finally(() => h.classList.remove('theme-vt'));
        } else go(); };
      window.__lvApply = apply;
      let t = 'midnight'; try { t = localStorage.getItem('lovinity-theme') || 'midnight'; } catch (e) {}
      apply(t);
      window.addEventListener('storage', (e) => { if (e.key === 'lovinity-theme') apply(e.newValue); });
    }
 this.state = { extra: [], meals: {}, evTitle: '', evDay: 0, evTime: 2, evWhoI: 0, day: 0, done: { 'Dates': true } }; }
  // sheet kit: same open, drag-to-dismiss and toast behaviour on every screen
  kShow(ksheet, extra) { clearTimeout(this.kt); this.setState(Object.assign({ ksheet, ksdy: 0, ksdrag: false }, extra || {})); }
  kDismiss() {
    // shortcut: CSS spring can't inherit release velocity; use a JS spring in the real app
    clearTimeout(this.kt); this.setState({ ksdy: 720, ksdrag: false });
    this.kt = setTimeout(() => this.setState({ ksheet: null, ksdy: 0 }), 380);
  }
  kNotify(text, undo) { clearTimeout(this.ktt); this.kUndoFn = undo || null; this.setState({ ktoast: text }); this.ktt = setTimeout(() => this.setState({ ktoast: null }), 2800); }
  kit() {
    const s = this.state, d = s.ksdy || 0;
    return {
      kOpen: !!s.ksheet, kClose: () => this.kDismiss(), kHasToast: !!s.ktoast, kToast: s.ktoast || '', kCanUndo: !!(s.ktoast && this.kUndoFn),
      kUndo: () => { clearTimeout(this.ktt); if (this.kUndoFn) this.kUndoFn(); this.kUndoFn = null; this.setState({ ktoast: null }); },
      kSdy: d.toFixed(1), kScrimOp: Math.max(0, 1 - d / 420).toFixed(3), kSheetCls: s.ksdrag ? 'ksheet dragging' : 'ksheet',
      kDown: (e) => { e.currentTarget.setPointerCapture(e.pointerId); this.kd = { y0: e.clientY - (this.state.ksdy || 0), hist: [[e.timeStamp, e.clientY]] }; this.setState({ ksdrag: true }); },
      kMove: (e) => {
        if (!this.kd) return;
        const raw = e.clientY - this.kd.y0;
        // past the top, resist progressively instead of stopping hard
        const ksdy = raw >= 0 ? raw : -((-raw) * 400 * 0.55) / (400 + 0.55 * -raw);
        this.kd.hist.push([e.timeStamp, e.clientY]); if (this.kd.hist.length > 6) this.kd.hist.shift();
        this.setState({ ksdy });
      },
      kUp: () => {
        if (!this.kd) return;
        const h = this.kd.hist, a = h[0], b = h[h.length - 1];
        const v = b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) * 1000 : 0;
        this.kd = null;
        if ((this.state.ksdy || 0) + (v / 1000) * 0.998 / (1 - 0.998) > 180) this.kDismiss(); else this.setState({ ksdy: 0, ksdrag: false });
      }
    };
  }
  renderVals() {
    const G = 'var(--accent)', R = 'var(--partner)', N = 'var(--faint)';
    const plan = [
      { dow: 'Sun', num: 22, dinner: ['Lentil soup and bread', 'You cook'], events: [['Visit Naziha’s parents', '1:00 – 4:00 pm', R], ['Halaqa at the masjid', 'After Isha · 7:00 pm', G]] },
      { dow: 'Mon', num: 23, dinner: ['Chicken karahi', 'Naziha cooks'], events: [['Gym together', '6:30 am', N]] },
      { dow: 'Tue', num: 24, dinner: ['Leftovers', 'No cooking'], events: [] },
      { dow: 'Wed', num: 25, dinner: ['Salmon and rice', 'You cook'], events: [['Dentist — Naziha', '11:15 am', R]] },
      { dow: 'Thu', num: 26, dinner: ['Out: the place by the river', 'Booked for 7'], events: [['Dinner date', '7:00 pm · booked', G], ['Pay rent', 'All day', N]] },
      { dow: 'Fri', num: 27, dinner: ['Biryani', 'Cook together'], events: [['Jumu’ah', '12:30 pm', G]] },
      { dow: 'Sat', num: 28, dinner: ['Pancakes after Fajr', 'Together'], events: [['Fajr together, then pancakes', '5:59 am', G]] }
    ];
    (this.state.extra || []).forEach(([d, e]) => plan[d].events.push(e));
    Object.keys(this.state.meals || {}).forEach((d) => { plan[d].dinner = this.state.meals[d]; });
    const sel = plan[this.state.day];
    const days = plan.map((p, i) => ({
      dow: p.dow, num: p.num, on: i === this.state.day,
      aria: p.dow + ' ' + p.num + ', ' + p.events.length + ' events',
      dots: p.events.slice(0, 3).map((e) => ({ color: e[2] })),
      pick: () => this.setState({ day: i })
    }));
    const events = sel.events.length ? sel.events.map((e) => ({ title: e[0], when: e[1], color: e[2] })) : [{ title: 'Nothing planned', when: 'A quiet evening at home', color: 'var(--line)' }];
    const list = [['Basmati rice', 'R'], ['Yogurt', 'N'], ['Coriander', 'N'], ['Dates', 'R'], ['Lamb, 1 kg', 'R'], ['Lemons', 'N']];
    const done = this.state.done;
    const items = list.map(([name, who]) => ({
      name, who, done: !!done[name],
      box: done[name] ? 'box done' : 'box', text: done[name] ? 'struck' : '',
      bg: who === 'R' ? G : R, fg: who === 'R' ? 'var(--on-accent)' : 'var(--on-partner)',
      whoLabel: who === 'R' ? 'You are buying it' : 'Naziha is buying it',
      toggle: () => this.setState((s) => ({ done: Object.assign({}, s.done, { [name]: !s.done[name] }) }))
    }));
    return {
      ...this.kit(),
      ...(() => {
        const st = this.state, dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const times = ['Morning', 'Afternoon', 'After Maghrib', 'After Isha'], who = ['Together', 'You', 'Naziha'];
        const colors = ['var(--accent)', 'var(--accent)', 'var(--partner)'];
        const chips = (arr, k) => arr.map((t, i) => ({ t, on: st[k] === i ? 'true' : 'false', pick: () => this.setState({ [k]: i }) }));
        return {
          kTitle: st.ksheet === 'meal' ? 'Dinner for ' + dows[st.day] : 'New plan',
          isEvent: st.ksheet === 'event', isMeal: st.ksheet === 'meal',
          openEvent: () => this.kShow('event', { evTitle: '', evDay: st.day }), openMeal: () => this.kShow('meal'),
          evTitle: st.evTitle, onEv: (e) => this.setState({ evTitle: e.target.value }), noEv: !st.evTitle.trim(),
          evDays: chips(dows, 'evDay'), evTimes: chips(times, 'evTime'), evWho: chips(who, 'evWhoI'),
          saveEv: () => {
            const d = this.state.evDay;
            this.setState((p) => ({ extra: p.extra.concat([[d, [p.evTitle.trim(), times[p.evTime] + (p.evWhoI ? ' · ' + who[p.evWhoI] : ''), colors[p.evWhoI]]]]), day: d }));
            this.kDismiss(); this.kNotify('Added to ' + dows[d] + '. Naziha can see it');
          },
          mealOpts: [['🍲', 'Lentil soup and bread', 'You cook'], ['🍛', 'Chicken karahi', 'Naziha cooks'], ['🐟', 'Salmon and rice', 'You cook'], ['🥘', 'Biryani', 'Cook together'], ['🥡', 'Order in', 'No cooking']].map(([e, t, c]) => ({ e, t, c,
            pick: () => { const d = this.state.day; this.setState((p) => ({ meals: Object.assign({}, p.meals, { [d]: [t, c] }) })); this.kDismiss(); this.kNotify('Dinner set: ' + t); } }))
        };
      })(),

      days, events, items,
      dayName: this.state.day === 0 ? 'tonight' : sel.dow,
      meal: sel.dinner[0], cook: sel.dinner[1],
      left: list.filter(([n]) => !done[n]).length
    };
  }
}
</script>
